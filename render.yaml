# Render Infrastructure-as-Code (IaC) Blueprint Spec
# Repository: deploy_services_render.com
# Services: n8n Workflow Automation Engine

services:
  # n8n Web Service Specification
  - type: web
    name: n8n-automation-engine
    env: docker
    plan: free
    region: singapore # asia-south1 equivalent
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: WEBHOOK_URL
        value: https://n8n-fggh.onrender.com/
      - key: N8N_PAYLOAD_SIZE_MAX
        value: "16"
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: "none"
      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: "all"
      - key: EXECUTIONS_DATA_SAVE_MANUAL
        value: "false"
      - key: EXECUTIONS_DATA_SAVE_EXECUTION_PROGRESS
        value: "false"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "24" # Retain failed logs for 24 hours max
      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: "500"
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
    autoDeploy: true

# Blueprint metadata & deployment instructions
# ===================================================
# To deploy on Render:
# 1. Connect this repo (deploy_services_render.com) to Render Dashboard.
# 2. Select Blueprint Deployment (New -> Blueprint).
# 3. Render will auto-detect render.yaml and provision the n8n Docker instance.
